services:
  calendarr:
    build:
      context: .
      dockerfile: Dockerfile
    image: calendarr:latest
    environment:
      SONARR_API_URL: ${SONARR_API_URL}
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_URL: ${RADARR_API_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}
    ports:
      - "8383:8383"
    restart: unless-stopped
