[package]
name = "calendarr"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
icalendar = "0.17.13"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
